name: tests

# The trie utilities are written in boru, so CI builds `boru` from source
# before running anything. boru has no tagged release yet, and this library
# tracks boru-lang/boru `main` (no fixed pin): every run resolves main HEAD,
# builds it (cached by SHA), and gates on it — so an upstream break shows up
# here the day it lands. Last verified by hand against boru main @ 64c5ab2
# (see BORU-MAIN-VERIFICATION.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trie
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # The compiled binary only depends on BORU_REF (and the OS), so a hit
      # here lets us skip the clone + build entirely.
      - name: Resolve boru main HEAD
        id: boruref
        run: echo "sha=$(git ls-remote https://github.com/boru-lang/boru.git main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache boru binary
        id: cache-boru
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/boru
          key: boru-${{ steps.boruref.outputs.sha }}-${{ runner.os }}

      - name: Check out boru source
        if: steps.cache-boru.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: boru-lang/boru
          ref: ${{ steps.boruref.outputs.sha }}
          path: boru-src

      # `go install …/cmd/go/boru@latest` cannot work while cmd/go/go.mod
      # carries replace directives, so we build from the checkout with
      # -mod=mod instead. The CLI's main package is cmd/go/boru.
      - name: Build boru
        if: steps.cache-boru.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          cd boru-src/cmd/go
          GOWORK=off GOFLAGS=-mod=mod go build \
            -ldflags "-X github.com/boru-lang/boru/cmd/go.Version=${{ steps.boruref.outputs.sha }}" \
            -o "$HOME/.local/bin/boru" ./boru

      - name: Add boru to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report boru version
        run: boru -version

      # ONE execution path: since boru main 2026-09-19 a program compiles to
      # bytecode and runs on the VM, or fails with `[boru/compile_failed]`.
      # There is no interpreter fallback, and the old lanes this job ran — the
      # interpreter gate, `--compile` parity and the advisory `--force-compile`
      # lane — are retired upstream (the flags are usage errors now). So the
      # gate is: every suite exits 0 compiled (each assertion-bearing suite
      # ends asserting `Test.fail-count` is 0 and prints `all green`), and
      # `boru check` reports 0 errors on every suite AND every module. The
      # script is the single definition of that gate, shared with local runs;
      # see test/divergence/README.md.
      - name: Suites (compiled) + static check — HARD GATE
        run: BORU="$HOME/.local/bin/boru" test/divergence/run.sh

      # The perf workload must still do real work (it once silently built an
      # empty trie when a capitalised `def N` became a type) — a quick size
      # check, not a timing gate.
      - name: Bench smoke (N=500)
        run: SIZES=500 BORU="$HOME/.local/bin/boru" bench/run.sh | tee /dev/stderr | grep -q ' ok'

  # Lightweight guard for the agent-skill packaging (no boru needed). The
  # plugin must bundle its own copy of the skill — plugins can't point at an
  # external .claude/skills dir — so two copies exist and can drift.
  consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trie
        uses: actions/checkout@v4

      - name: SKILL.md copies are in sync
        run: |
          canonical=.claude/skills/trie-aql/SKILL.md
          bundled=plugins/trie-aql/skills/trie-aql/SKILL.md
          if ! diff -u "$canonical" "$bundled"; then
            echo "::error file=$bundled::Plugin skill has drifted from $canonical"
            echo "Fix by copying the canonical skill over the bundled one:"
            echo "  cp $canonical $bundled"
            exit 1
          fi
          echo "SKILL.md copies are identical."

      - name: JSON manifests are valid
        run: |
          for j in .claude-plugin/marketplace.json \
                   plugins/trie-aql/.claude-plugin/plugin.json \
                   api.json; do
            if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$j"; then
              echo "ok: $j"
            else
              echo "::error file=$j::invalid JSON"
              exit 1
            fi
          done
